# Model registry (master spec §2). One entry per model FAMILY: a
# pretrained/finetuned checkpoint pair sharing the same architecture.
#
# Rules (enforced by src/knobe/registry.py):
#   - A family missing either checkpoint is invalid for `role: core`
#     (hard error -- RQ1 needs the pretrained/finetuned pair) and a
#     warning otherwise.
#   - The curation reviewer model (Claude via API) must NEVER appear here
#     (REVIEWER_MODEL_FORBIDDEN: any model id containing "claude",
#     case-insensitive, anywhere in this file is a config error).
#   - model_key convention: "{family}-pretrained" / "{family}-instruct"
#     (see registry.model_key_for()).
families:
  # --- Core (Raimondi's exact trio; run first) --------------------------
  llama-3.1-8b:
    pretrained: meta-llama/Llama-3.1-8B
    finetuned: meta-llama/Llama-3.1-8B-Instruct
    tl_name: meta-llama/Llama-3.1-8B
    d_model: 4096
    n_layers: 32
    role: core

  mistral-7b-v0.1:
    pretrained: mistralai/Mistral-7B-v0.1
    finetuned: mistralai/Mistral-7B-Instruct-v0.1
    tl_name: mistralai/Mistral-7B-v0.1
    d_model: 4096
    n_layers: 32
    role: core

  gemma-2-9b:
    pretrained: google/gemma-2-9b
    finetuned: google/gemma-2-9b-it
    tl_name: google/gemma-2-9b
    d_model: 3584
    n_layers: 42
    role: core
    sae: gemma-scope

  # --- Debug (small/cheap, pipeline dry-runs) ----------------------------
  gemma-2-2b:
    pretrained: google/gemma-2-2b
    finetuned: google/gemma-2-2b-it
    tl_name: google/gemma-2-2b
    d_model: 2304
    n_layers: 26
    role: debug
    sae: gemma-scope

  # Optional debug entry -- cheap size axis within the Llama family
  # (Raimondi's own ablation used the 1B). Not required for any gate.
  llama-3.2-1b:
    pretrained: meta-llama/Llama-3.2-1B
    finetuned: meta-llama/Llama-3.2-1B-Instruct
    tl_name: meta-llama/Llama-3.2-1B
    d_model: 2048
    n_layers: 16
    role: debug

  # --- Extension menu -----------------------------------------------------
  olmo-2-7b:
    pretrained: allenai/OLMo-2-1124-7B
    finetuned: allenai/OLMo-2-1124-7B-Instruct
    tl_name: allenai/OLMo-2-1124-7B
    d_model: 4096
    n_layers: 32
    role: extension

  qwen2.5-14b:
    pretrained: Qwen/Qwen2.5-14B
    finetuned: Qwen/Qwen2.5-14B-Instruct
    tl_name: Qwen/Qwen2.5-14B
    d_model: 5120
    n_layers: 48
    role: extension-config-only
